name: CI

on:
  push:
    branches: [ "v2" ]
  pull_request:
    branches: [ "v2" ]
  workflow_dispatch:

jobs:
  test:
    name: Rate Limiter Tests (v2 only)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run Rate Limiter Tests with Maven
        run: mvn clean test --batch-mode --no-transfer-progress

      - name: Upload Rate Limiter Test Reports (v2 only)
        if: always() && (github.ref == 'refs/heads/v2' || github.base_ref == 'v2')
        uses: actions/upload-artifact@v4
        with:
          name: ratelimiter-test-reports
          path: '**/target/surefire-reports/*.xml'
          if-no-files-found: ignore
